name: Security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: security_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: PostgreSQL rate-limit integration
        run: node --test test/rateLimit.test.cjs
        env:
          RATE_LIMIT_TEST_DATABASE_URL: postgres://security_test:local_ci_only@127.0.0.1:5432/security_test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
